spring.application.name=Triggers
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:${DATABASE_URL:}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

google.drive.folder-id=${GDRIVE_FOLDER_ID:${GOOGLE_DRIVE_FOLDER_ID:}}
google.drive.credentials-path=${GOOGLE_DRIVE_CREDENTIALS_PATH:}
google.drive.credentials-json=${GOOGLE_CREDENTIALS_JSON:${GOOGLE_DRIVE_CREDENTIALS_JSON:}}
