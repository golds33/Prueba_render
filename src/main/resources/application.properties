spring.application.name=Triggers
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}

neon.api.key=${NEON_API_KEY:}
neon.project.id=${NEON_PROJECT_ID:}
neon.branch.id=${NEON_BRANCH_ID:}
