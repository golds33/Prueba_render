<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${producto.id == null ? 'Nuevo producto' : 'Editar producto'}">Nuevo producto</title>
	<link rel="stylesheet" th:href="@{/styles.css}">
</head>

<body>
	<main class="page-shell narrow-shell">
		<nav class="topbar" aria-label="Navegación principal">
			<a class="brand" th:href="@{/productos}"><span class="brand-mark">T</span> Tienda</a>
			<span class="topbar-label">Panel de inventario</span>
		</nav>
		<a class="back-link" th:href="@{/productos}">&larr; Volver al catálogo</a>
		<section class="form-panel">
			<p class="eyebrow" th:text="${producto.id == null ? 'Nuevo registro' : 'Actualizar registro'}">Nuevo
				registro</p>
			<h1 th:text="${producto.id == null ? 'Registrar producto' : 'Editar producto'}">Registrar producto</h1>
			<p class="subtitle">Completa la información principal del producto.</p>

			<form class="product-form" th:action="@{/productos/guardar}" th:object="${producto}" method="post"
				enctype="multipart/form-data">

				<input type="hidden" th:field="*{id}">

				<label for="nombre">Nombre del producto</label>
				<input id="nombre" type="text" th:field="*{nombre}" placeholder="Ej. Café molido" required
					maxlength="120">

				<label for="precio">Precio</label>
				<div class="input-prefix"><span>$</span><input id="precio" type="number" step="0.01" min="0"
						th:field="*{precio}" placeholder="0.00" required></div>

				<label for="stock">Unidades disponibles</label>
				<input id="stock" type="number" min="0" step="1" th:field="*{stock}" placeholder="0" required>

				<label for="imagen">Imagen del producto</label>
				<div class="image-dropzone" id="image-dropzone">
					<input id="imagen" name="imagen" type="file" accept="image/jpeg,image/png,image/webp,image/gif"
						hidden>
					<button class="button button-secondary" id="select-image" type="button">Seleccionar imagen</button>
					<span id="image-preview-empty">Arrastra una imagen aquí o selecciónala (máximo 5 MB)</span>
					<img id="image-preview-image" alt="Vista previa de la imagen"
						th:if="${producto.imagenDatos != null}" th:src="@{/productos/imagen/{id}(id=${producto.id})}">
					<img id="image-preview-image" alt="Vista previa de la imagen"
						th:if="${producto.imagenDatos == null and producto.imagenUrl != null and !#strings.isEmpty(producto.imagenUrl)}"
						th:src="${producto.imagenUrl}">
					<img id="image-preview-image" alt="Vista previa de la imagen" hidden
						th:unless="${producto.imagenDatos != null or (producto.imagenUrl != null and !#strings.isEmpty(producto.imagenUrl))}">
				</div>

				<div class="form-actions">
					<a class="button button-secondary" th:href="@{/productos}">Cancelar</a>
					<button class="button button-primary" type="submit"
						th:text="${producto.id == null ? 'Guardar producto' : 'Guardar cambios'}">Guardar
						producto</button>
				</div>

			</form>
		</section>
	</main>
	<script>
		const imageInput = document.getElementById('imagen');
		const previewImage = document.getElementById('image-preview-image');
		const previewEmpty = document.getElementById('image-preview-empty');
		const imageDropzone = document.getElementById('image-dropzone');
		const selectImageButton = document.getElementById('select-image');
		const allowedImageTypes = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'];
		let previewObjectUrl;

		function showImageError(message) {
			previewEmpty.textContent = message;
			previewEmpty.hidden = false;
			imageDropzone.classList.add('has-error');
		}

		function previewSelectedImage(file) {
			imageDropzone.classList.remove('has-error');
			if (!file) return;
			if (!allowedImageTypes.includes(file.type)) {
				imageInput.value = '';
				return showImageError('Formato no permitido. Usa JPG, PNG, WEBP o GIF.');
			}
			if (file.size > 5 * 1024 * 1024) {
				imageInput.value = '';
				return showImageError('La imagen supera el límite de 5 MB.');
			}
			if (previewObjectUrl) URL.revokeObjectURL(previewObjectUrl);
			previewObjectUrl = URL.createObjectURL(file);
			previewImage.src = previewObjectUrl;
			previewImage.classList.remove('is-hidden');
			previewEmpty.hidden = true;
		}

		selectImageButton.addEventListener('click', () => imageInput.click());
		imageInput.addEventListener('change', () => previewSelectedImage(imageInput.files[0]));
		imageDropzone.addEventListener('dragover', (event) => {
			event.preventDefault();
			imageDropzone.classList.add('is-dragging');
		});
		imageDropzone.addEventListener('dragleave', () => imageDropzone.classList.remove('is-dragging'));
		imageDropzone.addEventListener('drop', (event) => {
			event.preventDefault();
			imageDropzone.classList.remove('is-dragging');
			const [file] = event.dataTransfer.files;
			if (!file) return;
			const transfer = new DataTransfer();
			transfer.items.add(file);
			imageInput.files = transfer.files;
			previewSelectedImage(file);
		});
		previewImage.addEventListener('error', () => showImageError('No se pudo cargar la imagen actual.'));
	</script>

</body>

</html>
